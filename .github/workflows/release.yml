name: Release

# Every tag vX.Y.Z publishes a GitHub Release with ready-to-run executables of the
# dashboard for Windows and Linux and the firmware images for every target. A manual
# run builds the same artifacts without publishing, for review.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ARM_GNU_VERSION: "14.2.rel1"

jobs:
  dashboard:
    name: Dashboard executable (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: ExcimerBurstControl.exe
          - name: linux-x64
            os: ubuntu-22.04          # oldest supported glibc -> widest compatibility
            exe: ExcimerBurstControl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-packaging.txt

      - name: Build single-file executable
        run: pyinstaller packaging/excimer_burst_control.spec --noconfirm --clean

      - name: Self-test the packaged executable (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/${{ matrix.exe }} --version
          ./dist/${{ matrix.exe }} --self-test --report selftest.txt
          cat selftest.txt

      - name: Self-test the packaged executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # A windowed executable detaches from the console: wait for it explicitly.
          $p = Start-Process -FilePath "dist/${{ matrix.exe }}" `
                 -ArgumentList "--self-test", "--report", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          exit $p.ExitCode

      - name: Package
        shell: bash
        run: |
          name="ExcimerBurstControl-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir -p "pkg/$name"
          cp "dist/${{ matrix.exe }}" packaging/QUICKSTART.txt LICENSE selftest.txt "pkg/$name/"
          cd pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          sha256sum * > "$name.sha256"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.name }}
          path: pkg/*

  firmware:
    name: Firmware image (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { preset: zynqmp-a53-board, target: zynqmp_a53, triple: aarch64-none-elf }
          - { preset: zynqmp-r5f-board, target: zynqmp_r5f, triple: arm-none-eabi }
          - { preset: cortex-m7-board, target: cortex_m7, triple: arm-none-eabi }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: toolchain-cache
        with:
          path: /opt/arm-gnu-toolchain
          key: arm-gnu-${{ env.ARM_GNU_VERSION }}-${{ matrix.triple }}
      - name: Download Arm GNU Toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          base="https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_GNU_VERSION}/binrel"
          sudo mkdir -p /opt/arm-gnu-toolchain
          curl -fsSL "${base}/arm-gnu-toolchain-${ARM_GNU_VERSION}-x86_64-${{ matrix.triple }}.tar.xz" \
            | sudo tar -xJ -C /opt/arm-gnu-toolchain --strip-components=1
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          export PATH="/opt/arm-gnu-toolchain/bin:$PATH"
          cd firmware && cmake --workflow --preset ${{ matrix.preset }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            firmware/build/${{ matrix.preset }}/bsp/${{ matrix.target }}/*.elf
            firmware/build/${{ matrix.preset }}/bsp/${{ matrix.target }}/*.bin

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dashboard, firmware]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          echo "notes:"; cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            assets/dashboard-*/*
            assets/firmware-*/*
