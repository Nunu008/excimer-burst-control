name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: python -m ruff check src tests main.py scripts

      - name: Ruff (format check)
        run: python -m ruff format --check src tests main.py scripts

      - name: Pytest
        run: python -m pytest -q

  ui-smoke:
    name: Qt import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Import UI modules offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import src.ui.main_window  # noqa: F401
          import src.ui.widgets.heatmap  # noqa: F401
          print("UI modules import cleanly")
          PY
